services:
  - type: web
    name: employee-management
    env: java
    plan: free
    region: oregon
    buildCommand: ./mvnw -DskipTests package
    startCommand: java -jar target/EmployeeManagement-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: render
